<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<div id="app" class="container mt-5">
    <h1 class="mb-4">Games List</h1>

    <table id="gamesTable" class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Name</th>
            <th>Price</th>
        </tr>
        </thead>
        <tbody>
        <tr v-for="game in games" :key="game.id">
            <td>{{ game.name }}</td>
            <td>{{ game.price }}</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/vue@3.2.47/dist/vue.global.js"></script>
<script>
    Vue.createApp({
        data() {
            return {
                games: [
                    { id: 1, name: 'Minecraft', price: 26.99 },
                    { id: 2, name: 'Tetris', price: 4.99 },
                    { id: 3, name: 'Counter-Strike', price: 0.00 }
                ]
            }
        }
    }).mount('#app')
</script>
</body>
</html>
