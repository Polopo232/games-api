<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<div id="app" class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Games List</h1>
        <div>
            <template v-if="token">
                <span class="badge me-2" :class="isAdmin ? 'bg-success' : 'bg-info text-dark'">{{ username }} ({{ role }})</span>
                <button class="btn btn-outline-secondary btn-sm" @click="logout">Logout</button>
            </template>
            <template v-else>
                <span class="badge bg-secondary me-2">Guest (read only)</span>
                <button class="btn btn-primary btn-sm" @click="openLogin">Login</button>
            </template>
        </div>
    </div>

    <div v-if="message" class="alert alert-danger alert-dismissible" role="alert">
        {{ message }}
        <button type="button" class="btn-close" aria-label="Close" @click="message = ''"></button>
    </div>

    <div v-if="isAdmin" class="mb-3">
        <button class="btn btn-success" @click="openAdd">+ Add game</button>
    </div>

    <table id="gamesTable" class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th v-if="isAdmin" style="width: 1%; white-space: nowrap;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr v-for="game in games" :key="game.id">
            <td><a href="#" @click.prevent="getGame(game.id)">{{ game.name }}</a></td>
            <td>{{ game.price }}</td>
            <td v-if="isAdmin" style="white-space: nowrap;">
                <button class="btn btn-sm btn-warning me-1" @click="openEdit(game)">Edit</button>
                <button class="btn btn-sm btn-danger" @click="deleteGame(game)">Delete</button>
            </td>
        </tr>
        <tr v-if="games.length === 0">
            <td :colspan="isAdmin ? 3 : 2" class="text-center text-muted">No games</td>
        </tr>
        </tbody>
    </table>

    <div class="modal fade" id="gameInfoModal" tabindex="-1"
         aria-labelledby="gameInfoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="gameInfoModalLabel">Game Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped">
                        <tr>
                            <th>ID</th>
                            <td>{{ gameInModal.id }}</td>
                        </tr>
                        <tr>
                            <th>Name</th>
                            <td>{{ gameInModal.name }}</td>
                        </tr>
                        <tr>
                            <th>Price</th>
                            <td>{{ gameInModal.price }}</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="gameFormModal" tabindex="-1"
         aria-labelledby="gameFormModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" @submit.prevent="saveGame">
                <div class="modal-header">
                    <h5 class="modal-title" id="gameFormModalLabel">{{ form.id ? 'Edit game' : 'Add game' }}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div v-if="formError" class="alert alert-danger">{{ formError }}</div>
                    <div class="mb-3">
                        <label for="gameName" class="form-label">Name</label>
                        <input id="gameName" type="text" class="form-control" v-model="form.name" required>
                    </div>
                    <div class="mb-3">
                        <label for="gamePrice" class="form-label">Price</label>
                        <input id="gamePrice" type="number" step="0.01" min="0" class="form-control"
                               v-model.number="form.price" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="loginModal" tabindex="-1"
         aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" @submit.prevent="login">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Login / Register</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div v-if="loginError" class="alert alert-danger">{{ loginError }}</div>
                    <div class="mb-3">
                        <label for="loginUsername" class="form-label">Username</label>
                        <input id="loginUsername" type="text" class="form-control" autocomplete="username"
                               v-model="loginForm.username" required>
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Password</label>
                        <input id="loginPassword" type="password" class="form-control" autocomplete="current-password"
                               v-model="loginForm.password" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-outline-primary" @click="register">Register</button>
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/vue@3.2.47/dist/vue.global.js"></script>
<script src="rest-client.js"></script>
</body>
</html>
