swagger: '2.0'
info:
  title: Games API
  version: 1.0.0
  description: |
    ### This is a Swagger UI for our Games API 

    ### Error handling
    Errors are presented using the HTTP status codes 400-599. The response include a more detailed explanation about the error in the body.

    ```
    {
      "error": "Cleartext explanation of the error that occurred"
    }
    ```

    ### Generic API errors
    These error responses can be returned by any of the described endpoints.

    | HTTP status | Description |
    |---|---|
    | 400| Bad input parameters or invalid request. More information can be found in the response body.
    | 401| The consumer does not have access to the requested resource or the provided token is not valid.
    | 404| The requested resource can not be found or the user does not have access to the resource.
    | 5XX| A server error has occurred while processing the request.

paths:
  /games:
    get:
      tags:
        - games
      summary: Get a list of all games
      description: Returns a list of all games in API
      responses:
        '200':
          description: Returns a list of games
          schema:
            type: array
            items:
              $ref: '#/definitions/Game'
    post:
      tags:
        - new-game
      summary: Creates a game
      description: Creates a new game
      parameters:
        - in: body
          name: body
          required: true
          description: A new game to be created
          schema:
            $ref: '#/definitions/NewGame'
      responses:
        '201':
          description: Game created successfully
          schema:
            $ref: '#/definitions/Game'
        '400':
          description: One or all params are missing
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Game with this name already exists
          schema:
            $ref: '#/definitions/Error'

  /games/{id}:
    get:
      tags:
        - games
      summary: Get full details of a given game
      description: Returns details of a single game
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: ID of the game to fetch
      responses:
        '200':
          description: Full details of a given game
          schema:
            $ref: '#/definitions/Game'
        '404':
          description: Game was not found in games array
          schema:
            $ref: '#/definitions/Error'
    put:
      tags:
        - update-game
      summary: Updates a game
      description: Replaces name and price of an existing game
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: ID of the game to update
        - in: body
          name: body
          required: true
          description: New data for the game
          schema:
            $ref: '#/definitions/NewGame'
      responses:
        '200':
          description: Game updated successfully
          schema:
            $ref: '#/definitions/Game'
        '400':
          description: One or all params are missing or invalid
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Game was not found in games array
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Game with this name already exists
          schema:
            $ref: '#/definitions/Error'
    delete:
      tags:
        - delete-game
      summary: Deletes a game
      description: Deletes a game by its ID
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: ID of the game to delete
      responses:
        '204':
          description: Game was successfully deleted (No Content)
        '404':
          description: Game was not found in games array
          schema:
            $ref: '#/definitions/Error'

definitions:
  Game:
    type: object
    properties:
      id:
        type: string
        example: 665f1c2e8a1b2c3d4e5f6a7b
      name:
        type: string
        example: Witcher 3
      price:
        type: number
        example: 29.99

  NewGame:
    type: object
    required:
      - name
      - price
    properties:
      name:
        type: string
        example: Tetris
      price:
        type: number
        format: float
        example: 0.99

  DeleteGame:
    type: object
    required:
      - id
    properties:
      id:
        type: string
        example: 665f1c2e8a1b2c3d4e5f6a7b

  Error:
    type: object
    properties:
      error:
        type: string
        example: Game not found