swagger: '2.0'
info:
  title: Games API
  version: 1.0.0
  description: |
    ### This is a Swagger UI for our Games API 

    ### Error handling
    Errors are presented using the HTTP status codes 400-599. The response include a more detailed explanation about the error in the body.

    ```
    {
      "error": "Cleartext explanation of the error that occurred"
    }
    ```

    ### Generic API errors
    These error responses can be returned by any of the described endpoints.

    | HTTP status | Description |
    |---|---|
    | 400| Bad input parameters or invalid request. More information can be found in the response body.
    | 401| The consumer does not have access to the requested resource or the provided token is not valid.
    | 403| The user is logged in but is not an admin.
    | 404| The requested resource can not be found or the user does not have access to the resource.
    | 5XX| A server error has occurred while processing the request.

    ### Roles
    * **user** - can only view games (GET).
    * **admin** - can also add, edit and delete games (POST / PUT / DELETE).

    Log in with `POST /login`, copy the `token` and press **Authorize** at the top of this page.
    Paste only the token, without the word `Bearer`.

    Default accounts: `admin` / `123` and `user` / `user123`.

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: 'Paste only the token returned by POST /login'

paths:
  /login:
    post:
      tags:
        - auth
      summary: Log in
      description: Returns a token that must be sent in the Authorization header
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Credentials'
      responses:
        '200':
          description: Logged in successfully
          schema:
            $ref: '#/definitions/LoginResult'
        '400':
          description: username or password missing
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Wrong username or password
          schema:
            $ref: '#/definitions/Error'

  /register:
    post:
      tags:
        - auth
      summary: Register a new user
      description: Creates a regular user (role "user") and logs them in
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Credentials'
      responses:
        '201':
          description: User created
          schema:
            $ref: '#/definitions/LoginResult'
        '400':
          description: username or password missing or too short
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Username is already taken
          schema:
            $ref: '#/definitions/Error'

  /logout:
    post:
      tags:
        - auth
      summary: Log out
      security:
        - Bearer: []
      responses:
        '204':
          description: Logged out
        '401':
          description: Not logged in
          schema:
            $ref: '#/definitions/Error'

  /me:
    get:
      tags:
        - auth
      summary: Current user
      security:
        - Bearer: []
      responses:
        '200':
          description: The logged in user
          schema:
            $ref: '#/definitions/User'
        '401':
          description: Not logged in
          schema:
            $ref: '#/definitions/Error'

  /games:
    get:
      tags:
        - games
      summary: Get a list of all games
      description: Returns a list of all games in API
      responses:
        '200':
          description: Returns a list of games
          schema:
            type: array
            items:
              $ref: '#/definitions/Game'
    post:
      tags:
        - new-game
      summary: Creates a game (admin only)
      security:
        - Bearer: []
      description: Creates a new game
      parameters:
        - in: body
          name: body
          required: true
          description: A new game to be created
          schema:
            $ref: '#/definitions/NewGame'
      responses:
        '201':
          description: Game created successfully
          schema:
            $ref: '#/definitions/Game'
        '401':
          description: Not logged in
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Only admin can do this
          schema:
            $ref: '#/definitions/Error'
        '400':
          description: One or all params are missing
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Game with this name already exists
          schema:
            $ref: '#/definitions/Error'

  /games/{id}:
    get:
      tags:
        - games
      summary: Get full details of a given game
      description: Returns details of a single game
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: ID of the game to fetch
      responses:
        '200':
          description: Full details of a given game
          schema:
            $ref: '#/definitions/Game'
        '404':
          description: Game was not found in games array
          schema:
            $ref: '#/definitions/Error'
    put:
      tags:
        - update-game
      summary: Updates a game (admin only)
      security:
        - Bearer: []
      description: Replaces name and price of an existing game
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: ID of the game to update
        - in: body
          name: body
          required: true
          description: New data for the game
          schema:
            $ref: '#/definitions/NewGame'
      responses:
        '200':
          description: Game updated successfully
          schema:
            $ref: '#/definitions/Game'
        '401':
          description: Not logged in
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Only admin can do this
          schema:
            $ref: '#/definitions/Error'
        '400':
          description: One or all params are missing or invalid
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Game was not found in games array
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Game with this name already exists
          schema:
            $ref: '#/definitions/Error'
    delete:
      tags:
        - delete-game
      summary: Deletes a game (admin only)
      security:
        - Bearer: []
      description: Deletes a game by its ID
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: ID of the game to delete
      responses:
        '204':
          description: Game was successfully deleted (No Content)
        '401':
          description: Not logged in
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Only admin can do this
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Game was not found in games array
          schema:
            $ref: '#/definitions/Error'

definitions:
  Credentials:
    type: object
    required:
      - username
      - password
    properties:
      username:
        type: string
        example: admin
      password:
        type: string
        example: '123'

  User:
    type: object
    properties:
      username:
        type: string
        example: admin
      role:
        type: string
        enum: [admin, user]
        example: admin

  LoginResult:
    type: object
    properties:
      token:
        type: string
        example: 3f9c2a...
      user:
        $ref: '#/definitions/User'

  Game:
    type: object
    properties:
      id:
        type: integer
        example: 1
      name:
        type: string
        example: Witcher 3
      price:
        type: number
        example: 29.99

  NewGame:
    type: object
    required:
      - name
      - price
    properties:
      name:
        type: string
        example: Tetris
      price:
        type: number
        format: float
        example: 0.99

  DeleteGame:
    type: object
    required:
      - id
    properties:
      id:
        type: integer
        example: 2

  Error:
    type: object
    properties:
      error:
        type: string
        example: Game not found